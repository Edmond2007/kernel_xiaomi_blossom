name: Build Kernel

on:
  push:
    branches:
      - rebase
  workflow_dispatch:

env:
  ARCH: arm64
  DEVICE: blossom
  THREADS: ${{ github.runner.processor_count }}
  CCACHE_DIR: /tmp/ccache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ccache_key: ${{ steps.setup_ccache.outputs.key }}
    steps:
      - name: Setup ccache
        id: setup_ccache
        uses: actions/cache@v3
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

  build_kernel:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # ... [previous setup steps remain unchanged] ...

      - name: Notify Telegram build start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🏗️ *Kernel Build Started* 🏗️
            *Device*: ${{ env.DEVICE }}
            *Architecture*: ${{ env.ARCH }}
            *Compiler*: 
            - Clang: ${{ env.CLANG_VERSION }}
            - GCC: ${{ env.GCC_VERSION }}
            *Commit*: [${GITHUB_SHA:0:7}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            *Workflow*: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          parse_mode: markdown

      # ... [build steps remain unchanged until artifact creation] ...

      - name: Get artifact download URL
        if: success()
        id: artifact
        run: |
          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "ARTIFACT_URL=${ARTIFACT_URL}" >> $GITHUB_ENV
          echo "ARTIFACT_DOWNLOAD_URL=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 *Successful Kernel Build* 🚀
            *Device*: ${{ env.DEVICE }}
            *Version*: ${{ env.KERNEL_VERSION }}
            *Build Date*: ${{ env.BUILD_DATE }}
            *Build Time*: ${{ env.BUILD_TIME }}s
            *MD5 Checksum*: `${{ env.MD5_CHECKSUM }}`
            *Commit*: [${GITHUB_SHA:0:7}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            *Artifact*: [${{ env.ZIP_NAME }}](${{ env.ARTIFACT_URL }})
          parse_mode: markdown

      - name: Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Kernel Build Failed* ❌
            *Device*: ${{ env.DEVICE }}
            *Workflow*: [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            *Commit*: [${GITHUB_SHA:0:7}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            *Error Context*:
            - Last 50 commits: [changes](${{ github.server_url }}/${{ github.repository }}/compare/${GITHUB_SHA}~50...${GITHUB_SHA})
            - Build logs attached below
          parse_mode: markdown

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            out/.config
            out/arch/arm64/boot/Image.gz
            out/build.log
          retention-days: 7

      - name: Capture build logs
        if: always()
        run: |
          # Capture last 100 lines of build output
          echo "### Build Log Excerpt ###" > build.log
          tail -n 100 out/build.log >> build.log
          echo "CCACHE Stats:" >> build.log
          ccache --show-stats >> build.log
